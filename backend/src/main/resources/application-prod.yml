# Production profile — activated via SPRING_PROFILES_ACTIVE=prod
# Database credentials are injected by Render from the managed PostgreSQL instance.
spring:
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/${SPRING_DATASOURCE_DATABASE}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  auth:
    cookie-secure: true
    cookie-same-site: None
  cors:
    allowed-origins: ${FRONTEND_URL}
