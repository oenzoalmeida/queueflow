services:
  - type: web
    name: queueflow-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    autoDeployTrigger: commit
    # Monorepo: só redeploya o backend quando algo que afeta a imagem dele mudar.
    # Alterações em frontend/**, workflows do GitHub, docs etc. não devem reiniciar
    # o serviço do backend no Render.
    buildFilter:
      paths:
        - backend/**
        - Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Banco migrado para PostgreSQL externo (Aiven Free) em 01/10/2026.
      # Valores definidos no dashboard do Render (credenciais fora do Git).
      # SPRING_DATASOURCE_URL sobrescreve spring.datasource.url do
      # application-prod.yml e inclui sslmode=require (exigido pelo Aiven).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
