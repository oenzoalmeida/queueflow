services:
  - type: web
    name: queueflow-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: queueflow-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: queueflow-db
          property: port
      - key: SPRING_DATASOURCE_DATABASE
        fromDatabase:
          name: queueflow-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: queueflow-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: queueflow-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

databases:
  - name: queueflow-db
    plan: free
    region: oregon
    databaseName: queueflow
    user: queueflow
