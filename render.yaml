services:
  - type: web
    name: queueflow-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Banco migrado para PostgreSQL externo (Aiven Free) em 01/10/2026.
      # Valores definidos no dashboard do Render (credenciais fora do Git).
      # SPRING_DATASOURCE_URL sobrescreve spring.datasource.url do
      # application-prod.yml e inclui sslmode=require (exigido pelo Aiven).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

databases:
  # DESACOPLADOS do serviço em 01/10/2026 (banco de produção migrado para o
  # Aiven Free). Mantidos no spec de propósito para o blueprint NÃO deletar
  # os recursos: queueflow-db (suspenso, backup exportado) e queueflow-db2
  # (ativo até 31/10/2026). Remover os dois blocos só quando decidirem
  # excluí-los definitivamente no dashboard do Render.
  - name: queueflow-db
    plan: free
    region: oregon
    databaseName: queueflow
    user: queueflow

  - name: queueflow-db2
    plan: free
    region: oregon
    databaseName: queueflow2
    user: queueflow
