name: Deploy Frontend (Firebase Hosting)

# Deploy manual apenas: não altera o deploy atual do Render/Netlify.
# Requer o secret FIREBASE_SERVICE_ACCOUNT (JSON da service account com papel
# "Firebase Hosting Admin") configurado no repositório.
#
# IMPORTANTE: o build precisa da VITE_API_URL definida, pois o Vite embute o
# valor nos assets. Sem ela, /api e /ws cairiam no próprio Hosting (404).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://queueflow-backend-is0i.onrender.com
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@latest deploy --only hosting --project oenzoa-queueflow --non-interactive
