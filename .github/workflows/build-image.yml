name: Build backend image (GHCR)

# Constrói a imagem Docker do backend e publica no GHCR para consumo
# externo (deploy de teste no Koyeb). Sem segredos: envs ficam no runtime.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/queueflow-backend:koyeb
