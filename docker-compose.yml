services:
  postgres:
    image: postgres:16-alpine
    container_name: queueflow-postgres
    environment:
      POSTGRES_DB: queueflow
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
    ports:
      - "5433:5432"
    volumes:
      - queueflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow -d queueflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  queueflow_pgdata:
